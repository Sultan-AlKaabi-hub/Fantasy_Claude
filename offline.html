<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gloomfall — offline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self'">
  <meta name="theme-color" content="#1a0f2e">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <main class="screen screen-title">
    <div class="panel panel-small">
      <p class="eyebrow">No connection</p>
      <h1 class="h2">The road is dark</h1>
      <p class="muted">Gloomfall was not fully installed before you went offline. Reconnect once and it will be playable offline forever after.</p>
      <div class="row"><a class="btn btn-primary" href="./">Try again</a></div>
    </div>
  </main>
</body>
</html>
